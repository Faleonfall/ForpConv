<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151d" />
    <!-- Applies the saved theme, else the system one, before first paint.
         The key matches THEME_STORAGE_KEY in src/lib/themeStorage.ts, and the
         colors match --color-background, which useTheme reads once mounted -->
    <script>
      let theme = null;
      try {
        theme = localStorage.getItem("forpconv-theme");
      } catch {}
      if (theme !== "dark" && theme !== "light") {
        theme = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
      if (theme === "light") {
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", "#f7efe5");
      }
    </script>

    <!-- Primary SEO Metadata -->
    <title>forpConv</title>

    <link rel="manifest" href="./site.webmanifest" />
